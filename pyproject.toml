[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chanakya"
version = "0.1.0"
description = "Chanakya — government procurement opportunity intelligence for Wayam AI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Wayam AI" }]
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<2.2",
  "alembic>=1.20,<2",
  "PyYAML>=6.0",
  "typer>=0.15",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "openpyxl>=3.1,<4",
  "Jinja2>=3.1",
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "tzdata>=2024.1",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pypdfium2>=4.30"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "respx>=0.21", "reportlab>=4.0", "ruff>=0.6"]

[project.scripts]
chanakya = "chanakya.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chanakya = ["reporting/templates/*.j2", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]

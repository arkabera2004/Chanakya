name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"   # Mondays 07:00 IST: new advisories and base-image changes surface without a push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Validate capability knowledge base
        run: chanakya --config config/chanakya.example.yaml capabilities validate
      - name: Tests (offline — fixtures and mocked providers only)
        run: pytest -q
      - name: Benchmark (simulated LLM, regression guard)
        run: chanakya --config config/chanakya.example.yaml benchmark

  # The same suite on PostgreSQL (roadmap Phase 4, milestone M5). Every test gets its own schema
  # (tests/dbsupport.py). The credentials below belong to a throwaway service container.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chanakya
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: chanakya_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chanakya -d chanakya_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CHANAKYA_TEST_DATABASE_URL: postgresql+psycopg://chanakya:ci-only-not-a-secret@localhost:5432/chanakya_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with the optional PostgreSQL driver)
        run: pip install -e ".[dev,postgres]"
      - name: Tests on PostgreSQL
        run: pytest -q
      - name: Migrations build an empty PostgreSQL database
        env:
          CHANAKYA_DATABASE_URL: ${{ env.CHANAKYA_TEST_DATABASE_URL }}
        run: |
          chanakya --config config/chanakya.demo.yaml db upgrade
          chanakya --config config/chanakya.demo.yaml db current --check
      - name: Demo run end to end on PostgreSQL (synthetic records, simulated model)
        env:
          CHANAKYA_DATABASE_URL: ${{ env.CHANAKYA_TEST_DATABASE_URL }}
        run: |
          python scripts/make_demo_data.py
          chanakya --config config/chanakya.demo.yaml run --dry-run
          chanakya --config config/chanakya.demo.yaml status

  # Known vulnerabilities in the installed dependency set, optional PostgreSQL driver included.
  # To accept an advisory, add --ignore-vuln <ID> here with the reason in a comment.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[postgres]" pip-audit
      - name: pip-audit
        run: pip-audit --skip-editable --desc

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chanakya:ci .
      - name: Smoke test
        run: docker run --rm -v "$PWD/config:/app/config:ro" -e CHANAKYA_CONFIG=/app/config/chanakya.example.yaml chanakya:ci capabilities validate
      - name: Migration scripts ship in the image (builds a SQLite database inside the container)
        run: docker run --rm -v "$PWD/config:/app/config:ro" -e CHANAKYA_CONFIG=/app/config/chanakya.example.yaml chanakya:ci db upgrade
      - name: Build the PostgreSQL variant
        run: docker build --build-arg INSTALL_POSTGRES=true -t chanakya:ci-postgres .
      - name: The PostgreSQL driver is importable in that image
        run: docker run --rm --entrypoint python chanakya:ci-postgres -c "import psycopg; print(psycopg.__version__)"

  # Live portal check — opt-in, never part of PR gating (portals change and rate-limit).
  live-sources:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - run: chanakya --config config/chanakya.example.yaml sources test --source cppp_central

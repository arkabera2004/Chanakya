# Wayam AI capability knowledge base — used by Chanakya's matching engine.
#
# Editable without code changes. Every capability records where the claim comes
# from (evidence_urls), how confident we are, and whether it is an existing
# offering or a potential custom build. Facts were taken from www.wayam.ai on
# 2026-10-10. Website marketing claims are treated as "existing offering" but
# NOT as proof of government references, certifications, turnover or team size —
# none of those were published, and Chanakya never assumes them.
#
# Matching fields:
#   keywords.strong  — phrases that on their own indicate a fit   (weight 0.45)
#   keywords.medium  — supporting phrases                          (weight 0.20)
#   keywords.weak    — context only; never enough on their own     (weight 0.06)
#   negative         — phrases that indicate a different kind of work (-0.30)
# Changing this file changes kb_version → affected tenders are re-evaluated.

kb_version: "2026-10-10.1"
company: Wayam AI
verified_on: "2026-10-10"
company_facts:
  headquarters: "Bengaluru, Karnataka, India (stated on website footer)"
  positioning: "Native agentic AI company; fixed-scope, milestone-gated, outcome-guaranteed delivery (website claim)"
  client_logos_note: >-
    The homepage lists logos under "Organizations our team has worked with" (GE, Daimler, Optum, Koch,
    Schneider Electric, Dassault Systèmes, Mahindra, Wabtec, Motorola Solutions). This describes team
    experience, not company contracts, and none are Indian government bodies. Do not use as government references.
  government_references: []        # none published — fill only with verified internal records
  certifications: []               # none published (e.g. ISO 27001, CMMI, CERT-In empanelment unknown)
  unverified_items:
    - "Annual turnover, years in operation, team size"
    - "Any past Indian government project, empanelment or MSME/DPIIT status"
    - "Indian-language support in Vakyam (website lists transcription but not languages)"
    - "ANPR capability in Arjuna (website shows vehicle classification and plate redaction, not plate reading)"
    - "Healthcare revenue-cycle / claims products (not found on website)"
    - "Dedicated mining offering (not found on website)"


filtering:
  skip_expired: true
  backfill_days: 14          # first scan of a source looks back this far
  reject_threshold: 0.10
  candidate_threshold: 0.20
  strong_threshold: 0.50

semantic:
  enabled: true
  backend: lexical           # lexical (free, default) | ollama (local embeddings only)
  embed_model: embeddinggemma
  candidate_threshold: 0.12
  weak_only_threshold: 0.15  # bar when the only rule evidence is weak context words (safety, plant, equipment)

llm:
  mode: disabled             # cloud | local | disabled | fake (simulated, for demos/tests)
  cloud_base_url: https://ollama.com
  local_base_url: http://localhost:11434
  api_key_env: OLLAMA_API_KEY
  fast_model: gpt-oss:20b    # verify names with `chanakya llm check` (cloud names come from /api/tags)
  deep_model: gpt-oss:120b
  think: low                 # thinking tokens are billed as output
  temperature: 0
  request_timeout_s: 120
  max_output_tokens_fast: 300
  max_output_tokens_deep: 1200
  max_retries: 2
  send_format_schema: auto   # auto = only for local Ollama (cloud does not support structured outputs)
  prompt_version: v2
  triage_band: [0.20, 0.50]  # combined match score range where the cheap model resolves ambiguity
  deep_min_score: 0.45

budget:
  max_cost_per_run_usd: 0.50
  max_cost_per_day_usd: 2.00
  max_calls_per_run: 500
  max_input_tokens_per_call: 6000
  max_documents_per_tender: 3
  max_pages_per_document: 80
  max_deep_analyses_per_run: 15

# USD per 1M tokens — Ollama Cloud price list as published on ollama.com/pricing (checked 2026-10-10).
# Some models are cheaper off-peak (outside 12:00 to 18:00 UTC on weekdays, and weekends); these are standard rates.
pricing:
  gpt-oss:20b: {input: 0.07, cached_input: 0.035, output: 0.30}
  gpt-oss:120b: {input: 0.15, cached_input: 0.014, output: 0.60}
  gemma4: {input: 0.14, cached_input: 0.05, output: 0.40}
  nemotron-3-nano: {input: 0.06, output: 0.24}
  glm-5.3-flash: {input: 0.15, cached_input: 0.03, output: 0.50}
  deepseek-v4.1-flash: {input: 0.30, cached_input: 0.006, output: 1.20}
  minimax-m2.7: {input: 0.30, cached_input: 0.06, output: 1.20}
  mistral-large-3: {input: 0.50, output: 1.50}

scoring:
  weights: {capability: 35, eligibility: 20, technical: 15, deadline: 10, commercial: 10, strategic: 10}
  priority_thresholds: {P1: 70, P2: 50, P3: 30}
  closing_soon_days: 7
  min_days_to_prepare: 5
  # Win history (doc 10). Off by default. When true, each OTHER notice from the same buyer that BD
  # recorded as Won adds bonus_per_win to the strategic component (0 to 1 scale), capped at max_bonus.
  # The reason is written into the score breakdown. Losses never lower a score.
  win_history_enabled: false
  win_history_bonus_per_win: 0.1
  win_history_max_bonus: 0.2

# `chanakya calibrate`: proposes scoring.weights from BD labels. It never edits this file or any score.
calibration:
  min_labels: 100            # no proposal below this many labelled notices
  min_labels_per_class: 10   # nor below this many relevant, or this many irrelevant
  l2: 1.0                    # pull toward the current weights; higher = smaller moves
  cv_folds: 5                # held-out check of the proposal; 0 turns it off

# Wayam's credentials. Unknown values stay null → eligibility is reported as unknown, never assumed.
# The desk's Company profile page saves to <data_dir>/<this file's name>.profile.yaml, which is laid over
# this block on every load. This file is never rewritten.
company_profile:
  name: Wayam AI
  annual_turnover_inr_crore: null
  average_turnover_3y_inr_crore: null
  years_in_operation: null
  certifications: []          # e.g. ["ISO 27001", "ISO 9001", "CMMI 3"] — only verified ones
  msme_registered: null
  dpiit_startup: null
  past_government_projects: null
  cert_in_empanelled: null

email:
  enabled: false
  provider: file             # file (writes .eml to outbox — test provider) | smtp
  smtp_host: ""               # your SMTP relay, e.g. Microsoft 365 or Google Workspace
  smtp_port: 587
  smtp_security: starttls
  username_env: CHANAKYA_SMTP_USERNAME
  password_env: CHANAKYA_SMTP_PASSWORD
  sender: chanakya@example.com  # replace with a mailbox your SMTP account may send as
  to: []                     # or set CHANAKYA_EMAIL_TO="a@x.com,b@y.com"
  cc: []
  min_score: 50
  closing_within_days: null
  attach_excel: true
  max_attachment_mb: 10
  subject_template: "CHANAKYA | Wayam AI Government Opportunities | {date}"
  outbox_dir: ./data/outbox
  digest: daily              # daily = a digest for every emailed run | weekly = one digest per week, on schedule.weekly_digest_day
  alert_on_new_p1: false     # true = on an emailed run, one message listing P1 notices not yet alerted (each notice once)
  # Follow-up alerts cover notices BD is working on: review status Shortlisted, Reviewing, Qualified,
  # Partner needed or Pursuing, or priority P1 that BD has not closed out (Rejected, Expired, Won, Lost).
  alert_on_corrigendum: false  # true = on an emailed run, one message listing material changes to those notices (each change once)
  corrigendum_alert_window_days: 7  # only changes detected this recently are alerted, so switching it on does not replay history
  alert_on_deadline: false   # true = on an emailed run, a reminder when one of those notices is close to its closing date
  deadline_alert_days: [7, 2]  # one reminder per notice at each of these many days before closing; closed or expired notices never
  max_retries: 3

schedule:
  daily_at: "07:30"          # IST
  weekdays_only: false
  weekly_digest_day: mon

documents:
  ocr_enabled: false         # requires the 'ocr' extra + tesseract binary
  ocr_languages: eng         # e.g. eng+hin when Hindi traineddata is installed
  max_zip_members: 200
  max_zip_total_mb: 200
  max_zip_ratio: 100
  min_chars_per_page: 40
  tables_enabled: true       # ruled PDF tables (BOQs) are rendered as delimited rows in the page text
  max_table_rows_per_document: 300   # past this, table pages keep plain text extraction

# Award notices (CPPP "Result of Tenders"). Off by default. Checked 2026-10-10: the page is a search form
# with an image CAPTCHA and lists nothing until the form is submitted, which Chanakya does not do.
# The results-table parser is tested against a synthetic fixture only. Real data comes in through
# `chanakya awards import <saved page or CSV>`. Run `chanakya awards test` before changing the status.
awards:
  enabled: false
  source_id: cppp_awards
  name: "GeM-CPPP: Results of Tenders (awards)"
  url: https://eprocure.gov.in/cppp/resultoftendersnew/cpppdata
  max_pages: 3
  verification_status: candidate

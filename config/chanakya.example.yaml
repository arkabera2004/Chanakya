# Chanakya configuration. Copy to config/chanakya.yaml (`chanakya init` does this).
# Secrets are NEVER written here — only the names of environment variables.
# Relative paths are resolved from the project root.

app:
  timezone: Asia/Kolkata
  data_dir: ./data
  database_url: sqlite:///./data/chanakya.db      # production: postgresql+psycopg://user@host/chanakya
  capabilities_file: ./config/wayam_capabilities.yaml
  reports_dir: ./data/reports
  report_retention: 30                             # keep the newest N workbooks
  inbox_dir: ./data/inbox                          # manual imports + inbox/documents/<Tender ID>/
  documents_dir: ./data/documents
  log_format: text                                 # text | json (one object per line for a log collector); env CHANAKYA_LOG_FORMAT overrides

http:
  # Identify the bot honestly; put a real contact address here before going live.
  user_agent: "ChanakyaBot/0.1 (Wayam AI procurement monitoring; contact: REPLACE-with-monitored-mailbox)"
  timeout_s: 30
  max_retries: 3
  backoff_base_s: 2
  min_interval_s: 3          # per-domain politeness delay between requests
  respect_robots_txt: true   # a disallow marks the source restricted; never bypassed
  max_download_mb: 25
  circuit_breaker_failures: 5
  circuit_breaker_cooldown_s: 3600
  allowed_domains:           # SSRF allowlist — the client refuses every other host
    - eprocure.gov.in
    - etenders.gov.in
    - defproc.gov.in
    - pmgsytenders.gov.in
    - eprocurebhel.co.in
    - coalindiatenders.nic.in
    - iocletenders.nic.in
    - eprocurebel.co.in
    - eprocuremdl.nic.in
    - arunachaltenders.gov.in
    - assamtenders.gov.in
    - etenders.chd.nic.in
    - dnhtenders.gov.in
    - ddtenders.gov.in
    - govtprocurement.delhi.gov.in
    - etenders.hry.nic.in
    - hptenders.gov.in
    - jktenders.gov.in
    - jharkhandtenders.gov.in
    - etenders.kerala.gov.in
    - tendersutl.gov.in
    - mptenders.gov.in
    - manipurtenders.gov.in
    - meghalayatenders.gov.in
    - mizoramtenders.gov.in
    - nagalandtenders.gov.in
    - tendersodisha.gov.in
    - pudutenders.gov.in
    - eproc.punjab.gov.in
    - eproc.rajasthan.gov.in
